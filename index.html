<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MovieHub</title>

    <!-- SEO -->
    <meta name="description" content="Discover and search for your favorite movies. Browse popular films and find something new to watch." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="MovieHub" />
    <meta property="og:description" content="Discover and search for your favorite movies." />
    <meta property="og:type" content="website" />

    <!-- Preconnect to speed up font load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Non-render-blocking font load (replaces @import in CSS) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&display=swap"
      />
    </noscript>

    <!-- Preconnect to TMDB image CDN -->
    <link rel="preconnect" href="https://image.tmdb.org" />

    <!-- Preconnect to Unsplash for hero image -->
    <link rel="preconnect" href="https://images.unsplash.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
